project:
  type: book
  output-dir: rapport
  post-render:
    - ./post-render.sh

book:
  title: "Prédiction de la Satisfaction Client pour les Parfums"
  subtitle: "Compléments de Mathématiques 2 -- Introduction au Machine Learning"
  sidebar:
    logo: uga-logo.png
  author:
    - "HAMLIL Mohamed"
  date: today
  date-format: "D MMMM YYYY"
  chapters:
    - index.qmd
    - notebooks/01_exploration.qmd
    - notebooks/02_preparation.qmd
    - notebooks/03_regression_logistique.qmd
    - notebooks/04_arbre_decision.qmd
    - notebooks/05_foret_aleatoire.qmd
    - notebooks/06_knn.qmd
    - notebooks/07_comparaison.qmd
  repo-url: https://github.com/mohamedhamlil/University-Coursework
  repo-subdir: Bachelor/L3/S6/ComplementMath2/Projet

lang: fr

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: custom.css
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    highlight-style: github
  pdf:
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    fig-cap-location: bottom
    echo: false
    # Article class + section-level chapters → no full chapter title pages,
    # nécessaire pour tenir dans la limite des 25 pages des consignes.
    documentclass: scrartcl
    classoption: [DIV=16, parskip=half-]
    top-level-division: section
    fontsize: 10pt
    geometry:
      - left=2cm
      - right=2cm
      - top=2.2cm
      - bottom=2.2cm
    include-in-header:
      - text: |
          \usepackage{xcolor}
          \definecolor{ugablue}{HTML}{1D2B44}
          \definecolor{ugaorange}{HTML}{E8601C}
          \AtBeginDocument{\hypersetup{linkcolor=ugaorange, urlcolor=ugablue, citecolor=ugablue}}
          \usepackage{fancyhdr}
          \pagestyle{fancy}
          \fancyhead[L]{\small\textcolor{ugablue}{Compléments de Mathématiques 2 — L3 MIASHS}}
          \fancyhead[R]{\small\textcolor{ugablue}{Projet de groupe}}
          \fancyfoot[C]{\textcolor{ugaorange}{\thepage}}
          \renewcommand{\headrulewidth}{0.4pt}
          \renewcommand{\headrule}{\hbox to\headwidth{\color{ugaorange}\leaders\hrule height \headrulewidth\hfill}}
          \usepackage{float}
          \usepackage{booktabs}
          \floatplacement{figure}{H}
          \floatplacement{table}{H}
          \addtokomafont{section}{\color{ugablue}\large}
          \addtokomafont{subsection}{\color{ugablue}\normalsize}
          \addtokomafont{subsubsection}{\color{ugablue}\normalsize}
          \RedeclareSectionCommand[beforeskip=6pt,afterskip=2pt]{section}
          \RedeclareSectionCommand[beforeskip=4pt,afterskip=1pt]{subsection}
          \RedeclareSectionCommand[beforeskip=3pt,afterskip=1pt]{subsubsection}
          \linespread{1.03}\selectfont
          \setlength{\parskip}{2pt plus 1pt minus 1pt}
          \setlength{\footnotesep}{0.5em}
          \renewcommand{\footnotesize}{\scriptsize}
          \newcommand\UGATitlePage{%
            \begin{titlepage}
              \begin{center}
                \vspace*{0.5cm}
                \includegraphics[width=3.5cm]{uga-logo.png}\\[1cm]
                {\color{ugaorange}\rule{\textwidth}{1.5pt}}\\[0.6cm]
                {\fontsize{22}{28}\selectfont\bfseries\color{ugablue} Prédiction de la Satisfaction Client\\pour les Parfums}\\[0.4cm]
                {\color{ugaorange}\rule{\textwidth}{1.5pt}}\\[0.6cm]
                {\large\itshape Compléments de Mathématiques 2 -- Introduction au Machine Learning}\\[0.2cm]
                {\normalsize L3 MIASHS -- Université Grenoble Alpes}\\[1.5cm]
                {\large HAMLIL Mohamed}\\[1.5cm]
                {\large \today}
              \end{center}
            \end{titlepage}
          }
          \AtBeginDocument{\UGATitlePage}

execute:
  # On désactive le cache knitr (notebooks/*_cache) car on a déjà
  # un cache filesystem explicite sous output/*.rds — sans cela
  # les .rds sont dupliqués, ~150 Mo de bloat dans notebooks/.
  cache: false
  warning: false
  message: false
  fig-align: center
  fig-width: 4.5
  fig-height: 2.6

bibliography: references.bib
