project:
  type: default

lang: fr

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: custom.css
    include-after-body: pdf-link.html
    format-links: false
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    embed-resources: true
    highlight-style: github
    date-format: "D MMMM YYYY"
  pdf:
    toc: true
    number-sections: true
    colorlinks: true
    include-in-header:
      - text: |
          \usepackage{fancyhdr}
          \pagestyle{fancy}
          \fancyhead[RO]{Lola Etiévant}
          \fancyhead[LO]{Compléments de Mathématiques 2 L3 MIASHS}

execute:
  warning: false
  message: false
  fig-align: center
