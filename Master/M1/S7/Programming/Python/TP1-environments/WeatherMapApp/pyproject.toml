[project]
name = "weather-map-app"
version = "0.1.0"
description = "Real-time weather from Open-Meteo, shown on a map (TP1 exercise 2)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pylint>=4.0.8",
    "pytest>=9.1.1",
    "types-requests>=2.33.0.20260906",
]
