project:
  type: book
  output-dir: rapport
  post-render:
    - ./post-render.sh

book:
  title: "Prédiction de la Satisfaction Client pour les Parfums"
  subtitle: "Compléments de Mathématiques 2 -- Introduction au Machine Learning"
  author:
    - "HAMLIL Mohamed"
    - "PARDO TERAN German"
    - "EL KORAICHI Mohamed Yassine"
    - "ANZID Keltoum"
  date: today
  date-format: "D MMMM YYYY"
  chapters:
    - index.qmd
    - notebooks/01_exploration.qmd
    - notebooks/02_preparation.qmd
    - notebooks/03_regression_logistique.qmd
    - notebooks/04_foret_aleatoire.qmd
    - notebooks/05_comparaison.qmd
  repo-url: https://github.com/mohamedhamlil/University-Coursework
  repo-subdir: Bachelor/L3/S6/ComplementMath2/Projet

lang: fr

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: custom.css
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    highlight-style: github
  pdf:
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    fig-cap-location: bottom
    echo: false
    documentclass: scrreprt
    classoption: [open=any, DIV=12]
    include-in-header:
      - text: |
          \usepackage{fancyhdr}
          \pagestyle{fancy}
          \fancyhead[RO]{HAMLIL Mohamed}
          \fancyhead[LO]{Compléments de Mathématiques 2 L3 MIASHS}
          \usepackage{float}
          \usepackage{booktabs}
          \floatplacement{figure}{H}
          \usepackage[most]{tcolorbox}
          \usepackage{etoolbox}
          \makeatletter
          \patchcmd{\scr@startchapter}{\if@openright\cleardoublepage\else\clearpage\fi}{\clearpage}{}{}
          \makeatother

execute:
  cache: true
  warning: false
  message: false
  fig-align: center
  fig-width: 5
  fig-height: 3

bibliography: references.bib
